<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le nombre du jour – Le compte est bon – CE1</title>
<style>
:root{--g:#2e9e4f;--r:#d93a3a;--b:#2b86d6;--o:#f08a24;--p:#e86aa6;--v:#8a4fb3;--y:#f2cd3a;--ink:#1d2433;--bg:#f4f1ea;
  --barre:#1fa57a;--cube:#f6d21c;--cell:18px;
  font-family:"Andika","Comic Sans MS","Chalkboard SE","Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
.g{color:var(--g)}.r{color:var(--r)}.b{color:var(--b)}

/* ---------- en-tête ---------- */
header{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff;box-shadow:0 2px 6px #0001;flex-wrap:wrap}
.nj{font-size:20px;font-weight:700;background:var(--y);border:none;border-radius:14px;padding:4px 16px;white-space:nowrap}
.nj b{font-size:34px;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav button{border:2px solid #ddd;background:#fff;border-radius:12px;padding:6px 10px;font-size:17px}
nav button.on{border-color:var(--ink);background:var(--ink);color:#fff}

.part{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:6px 14px;font-size:19px;font-weight:700}
#p1b{display:none}
body.p2 #p1b,body.p2 #p2b{display:inline-block}body.p2 #p2b{background:var(--ink);color:#fff}
body.p2 #nav,body.p2 #nj{display:none}
/* ---------- zones ---------- */
.fitw{transform-origin:top left}
#start .p2go{font-size:min(24px,3.4vh);border:3px solid var(--ink);background:#fff;border-radius:14px;padding:8px 18px;font-weight:700}
main{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:14px;min-height:0}
main.noaide{grid-template-columns:1fr}
main.noaide #aide{display:none}
.panel{background:#fff;border-radius:20px;padding:16px 20px;overflow:hidden;box-shadow:0 2px 10px #0001;min-height:0}
#aide{background:#fffbea;border:3px dashed #e8c54a}
#aide h3{margin:0 0 12px;font-size:24px;color:#8a6d00}
h2.t{font-size:40px;margin:0 0 16px;text-align:center}
.phrase{font-size:38px;text-align:center;margin-top:22px;min-height:1.3em;font-weight:700}
.hl{outline:5px solid #ff9800!important;outline-offset:3px;background:#fff1c9!important;transform:scale(1.06);transition:.2s}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.4);opacity:.2}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.flyer{position:fixed;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;font-weight:700}
.fdig{font-size:56px;text-shadow:0 2px 0 #fff}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid #c9b45a;margin:6px 0}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:17px}
.seg button.on{background:#8a6d00;color:#fff}
.note{font-size:19px;line-height:1.45}
.note p{margin:6px 0}

/* ---------- pied ---------- */
footer{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;background:#fff;flex-wrap:wrap}
footer button{font-size:22px;border:none;border-radius:14px;padding:12px 20px;background:#e9e6df}
footer button:disabled{opacity:.35}
#bCorr{background:var(--b);color:#fff;font-weight:700;font-size:26px;padding:12px 30px}
#bAide.on{background:#ffe48a}
footer select{font:inherit;font-size:18px;padding:8px;border-radius:10px}

/* ---------- écran de départ ---------- */
#start{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;gap:6vw;padding:3vh 3vw;overflow:hidden}
#start .sL{display:flex;flex-direction:column;align-items:center;gap:2vh;max-width:50vw}
#start h1{font-size:min(52px,7vh);margin:0;text-align:center}
#start .q{font-size:min(32px,4.5vh);text-align:center}
#aff{font-size:min(120px,16vh);line-height:1.2;font-weight:700;min-width:min(340px,40vw);text-align:center;background:#fff;border-radius:24px;padding:0 30px;border:5px solid var(--y);min-height:1.2em}
.pad{display:grid;grid-template-columns:repeat(3,min(110px,15vh));gap:min(12px,1.6vh)}
.pad button{height:min(96px,17vh);font-size:min(46px,7vh);border:none;border-radius:18px;background:#fff;box-shadow:0 3px 0 #0002}
.pad .ok{background:var(--g);color:#fff}
.pad .del{background:#f3d3d3}
#msg{font-size:min(22px,3vh);color:var(--r);min-height:1.3em}
#start .alea{font-size:min(22px,3.2vh);border:none;background:#fff;border-radius:12px;padding:8px 16px}

/* ---------- 1 Décomposition ---------- */
.decomp{display:flex;align-items:center;justify-content:center;gap:0}
.bx{width:190px;height:150px;border:7px solid;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:700;background:#fff}
.bx.g{border-color:var(--g)}.bx.r{border-color:var(--r)}.bx.b{border-color:var(--b)}
.bx.zero{opacity:.45}
.plus{font-size:60px;font-weight:700;margin:0 -8px;z-index:1;background:#fff;border:4px solid #888;border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;line-height:1}
table.tn{border-collapse:collapse;margin:0 auto 14px;font-size:60px;font-weight:700;text-align:center}
.tn th,.tn td{border:4px solid #555;width:120px;padding:4px}
.tn th{font-size:40px;line-height:1}
.tn th small{display:block;font-size:15px;color:#555;font-weight:400}
.tn td{height:95px;background:#fff}
.leg{display:flex;flex-direction:column;gap:4px;font-size:24px;align-items:center}
.expl{margin-top:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.el{font-size:30px;font-weight:700}

/* ---------- 2 Lettres ---------- */
.cadre{background:radial-gradient(circle,#fff 3.5px,transparent 4px) 0 0/30px 30px,var(--o);padding:20px;border-radius:12px}
.cahier{background:#fff;font-size:54px;line-height:1.7em;min-height:3.4em;padding:0 18px;color:var(--b);font-weight:700;word-break:break-word;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 1.28em,#b8bfcc 1.28em,#b8bfcc calc(1.28em + 2px),transparent calc(1.28em + 2px),transparent 1.7em),
  repeating-linear-gradient(to bottom,transparent 0,transparent .82em,#dde1e8 .82em,#dde1e8 calc(.82em + 2px),transparent calc(.82em + 2px),transparent 1.7em)}
.curs{display:inline-block;width:4px;height:.9em;background:var(--b);vertical-align:-.05em;animation:cl 1s steps(1) infinite}
@keyframes cl{50%{opacity:0}}
.nbl{text-align:center;font-size:40px;margin-bottom:12px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:10px}
.mot{background:#fff;border:2px solid #e2d6a4;border-radius:10px;padding:3px 6px;font-size:20px;text-align:center}
.mot b{display:block;font-size:24px;color:var(--b)}

/* ---------- 3 Matériel ---------- */
.mat{border:6px solid var(--b);border-radius:26px;padding:18px;min-height:280px;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;justify-content:center}
.grp{display:flex;gap:calc(var(--cell)*.35);flex-wrap:wrap;align-items:flex-end}
.grp.pl{display:grid;gap:8px}
.grp.cu{display:grid;grid-template-columns:repeat(5,var(--cell));gap:4px}
.plaque,.barre{background-color:var(--barre);border:2px solid #0d6e4f;border-radius:3px;
  background-image:linear-gradient(#000a 1.5px,transparent 1.5px),linear-gradient(90deg,#000a 1.5px,transparent 1.5px);background-size:var(--cell) var(--cell);background-position:-1px -1px}
.plaque{width:calc(var(--cell)*10 + 4px);height:calc(var(--cell)*10 + 4px)}
.barre{width:calc(var(--cell) + 4px);height:calc(var(--cell)*10 + 4px);background-image:linear-gradient(#000a 1.5px,transparent 1.5px)}
.cube{width:var(--cell);height:var(--cell);background:var(--cube);border:1px solid #b89a00;border-radius:2px;box-shadow:inset -2px -2px 0 #d9b400}
.compte{font-size:34px;text-align:center;margin-top:16px;min-height:1.3em}
.lg{display:flex;align-items:center;gap:16px;font-size:22px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;border:2px solid transparent}
.lg .pc{--cell:12px;flex:0 0 auto}

/* ---------- 4 Tirelire ---------- */
.tire{border:10px solid var(--p);border-radius:6px;min-height:280px;padding:16px 150px 16px 16px;position:relative;background:#fff}
.tire .pig{position:absolute;right:10px;bottom:6px;width:140px}
.zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.billet{width:130px;height:68px;border-radius:7px;position:relative;color:#fff;font-weight:700;box-shadow:0 2px 4px #0003;flex:0 0 auto;overflow:hidden;border:2px solid #0002}
.billet::before{content:"";position:absolute;right:-14px;top:8px;width:56px;height:56px;border-radius:50%;background:#fff3}
.billet .bv{position:absolute;left:7px;top:2px;font-size:30px}
.billet .bv2{position:absolute;right:8px;bottom:2px;font-size:18px}
.billet .be{position:absolute;left:8px;bottom:4px;font-size:12px;letter-spacing:2px}
.v5{background:#8f979e}.v10{background:#d9534f}.v20{background:#3d7cc9}.v50{background:#ee9a2c}.v100{background:#3a9e63}.v200{background:#c79a2a}.v500{background:#8456ad}
.coin{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 auto;box-shadow:0 2px 3px #0004}
.coin.e2{background:radial-gradient(circle,#e9c24b 0 55%,#c9ccd1 56%);color:#5b4500}
.coin.e1{background:radial-gradient(circle,#c9ccd1 0 55%,#e9c24b 56%);color:#333}
.coin.cu{background:#c47a3f;color:#fff;width:46px;height:46px;font-size:14px}
.coin.or{background:#dcb740;color:#5b4500;width:52px;height:52px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.cents{opacity:.45}
.total{font-size:32px;text-align:center;margin-top:16px;min-height:1.3em;font-weight:700}

/* ---------- 5 Abaque ---------- */
svg .bead{animation:drop .5s ease-in;transform-box:fill-box}
@keyframes drop{from{transform:translateY(-300px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 6 Pair / impair ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;background:#fff;border:3px solid}
.chip.p{border-color:var(--v);color:var(--v)}.chip.i{border-color:#999;color:#666}
.bignb{font-size:80px;font-weight:700;text-align:center}
.bignb span{display:inline-block;padding:0 6px;border-radius:12px}
.paires{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;--cell:34px}
.paire{display:flex;gap:4px;padding:6px;border:3px dashed var(--v);border-radius:12px}
.paire.seul{border-color:var(--r);background:#fde8e8}

/* ---------- 7 Encadrement ---------- */
.enc{border:6px solid #f1df7a;border-radius:26px;padding:26px 14px;display:flex;align-items:center;justify-content:center;gap:4px}
.sq{width:150px;height:120px;border:6px solid var(--r);border-radius:18px;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;font-size:52px;font-weight:700;background:#fff}
.sq .z0{color:#aaa}.sq.done .z0,.sq.done .pre{color:var(--r)}
.ci{width:128px;height:128px;border:6px solid #e06a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;margin:0 -3px;background:#fff}
.ci.mid{background:#dceffc}
.lt{font-size:30px;color:#888;width:0;overflow:visible;display:flex;justify-content:center;z-index:2}
.labs{display:flex;justify-content:space-between;font-size:20px;color:#666;margin:6px 30px 0}

/* ---------- 8 Ajouter / enlever ---------- */
.pm{display:grid;grid-template-columns:1fr auto auto auto 1fr;grid-template-rows:repeat(3,auto);gap:16px 10px;align-items:center}
.pb{height:110px;border:6px solid;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;background:#fff}
.fl{width:110px;height:58px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff}
.fl.l{clip-path:polygon(0 50%,32% 0,32% 25%,100% 25%,100% 75%,32% 75%,32% 100%)}
.fl.r{clip-path:polygon(100% 50%,68% 0,68% 25%,0 25%,0 75%,68% 75%,68% 100%)}
.fl.l span{margin-left:22px}.fl.r span{margin-right:22px}
.fl.hl{outline:none!important;filter:drop-shadow(0 0 6px #ff9800);background:#ff9800!important}
.cen{grid-column:3;grid-row:1/4;width:150px;height:150px;border-radius:50%;background:#ffb347;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;border:6px solid #e08a10}
.calc{font-size:38px;text-align:center;margin-top:14px;display:flex;flex-direction:column;gap:6px}
.chg{background:#ffe48a;border-radius:8px;padding:0 3px;color:var(--r)}
.tn.sm{font-size:44px}.tn.sm td{height:70px}.tn.sm th,.tn.sm td{width:90px}

/* ---------- 9 Le compte est bon ---------- */
.kc{position:relative;height:124px;width:var(--w);flex:0 0 auto;border:3px solid #4d6c99;border-radius:12px;
  background:#fff repeating-linear-gradient(to bottom,#fff 0,#fff 14px,#c3cddd 14px,#c3cddd 15.5px)}
.kc.d1{--w:70px}.kc.d2{--w:124px}.kc.d3{--w:166px}
.kc::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#6f86ab}
.kc.d2::before,.kc.d3::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#c3cddd}
.kc span{position:absolute;left:0;right:0;bottom:calc(50% - 3px);text-align:center;font-size:52px;line-height:.8;color:#3d5a85;font-weight:400;z-index:1}
.kc.mini{height:76px;background:#fff repeating-linear-gradient(to bottom,#fff 0,#fff 8.5px,#c3cddd 8.5px,#c3cddd 9.5px)}
.kc.mini.d1{--w:42px}.kc.mini.d2{--w:76px}.kc.mini.d3{--w:100px}
.kc.mini span{font-size:32px;bottom:calc(50% - 2px)}
.kc.used{opacity:.22;transform:scale(.92);transition:.4s}
.kc.res{border-color:var(--g);border-width:4px}
.kc.target{border-color:var(--o);border-width:6px}
.kc.win{box-shadow:0 0 0 6px #ffd54a,0 0 24px #ffb300}
.cbrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;margin:10px 0 16px}
.cbrow.prev .kc{cursor:pointer}
.cbtop{display:flex;align-items:center;justify-content:center;gap:30px}
.cbcible{display:flex;flex-direction:column;align-items:center;font-size:20px;color:#a35c00;font-weight:700;gap:4px}
.cbbtn{display:flex;flex-direction:column;gap:8px}
.mini-b{border:none;border-radius:12px;background:#e9e6df;padding:8px 14px;font-size:19px}
.cbcalc{display:flex;flex-wrap:wrap;gap:12px 48px;justify-content:center;align-items:center}
.cbl{background:#f7f9fc;border-radius:14px;padding:6px 12px}
.cbl{display:flex;align-items:center;gap:10px}
.cbl .op{font-size:44px;font-weight:700}
.cbl .tip{font-size:22px;color:#8a6d00;font-weight:700;margin-left:10px}
.inp h2.t{font-size:min(38px,5vh);margin:0 0 1.5vh}
.cbin{display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:stretch;height:calc(100% - min(38px,5vh) - 3vh)}
.cbL{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
.cbR{display:flex;flex-direction:column;gap:2vh;min-height:0}
.cbin .q{font-size:min(32px,4.5vh);font-weight:700}
.cbaff{font-size:min(70px,9vh);line-height:1.25;font-weight:700;min-width:240px;min-height:1.25em;text-align:center;background:#fff;border:4px solid var(--y);border-radius:20px}
.cbR .cbrow{justify-content:flex-start;margin:0;flex:1;align-content:flex-start;overflow:hidden}
.kc.mid{height:min(96px,12vh);background:#fff repeating-linear-gradient(to bottom,#fff 0,#fff calc(min(96px,12vh)/8 - 1.5px),#c3cddd calc(min(96px,12vh)/8 - 1.5px),#c3cddd calc(min(96px,12vh)/8))}
.kc.mid.d1{--w:min(56px,7vh)}.kc.mid.d2{--w:min(96px,12vh)}.kc.mid.d3{--w:min(128px,16vh)}
.kc.mid span{font-size:min(42px,5.4vh)}
.cbcible.mid-t{flex-direction:row;font-size:min(26px,3.6vh);gap:14px}
.cbmsg{font-size:19px;color:var(--r);min-height:1.2em}
.pad.sm{grid-template-columns:repeat(3,min(88px,11vh));gap:min(8px,1vh)}
.pad.sm button{height:min(70px,9.5vh);font-size:min(34px,5vh)}
.pad.sm .ok{font-size:22px}
.cbact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cbact{justify-content:flex-start}
.cbact button{border:none;border-radius:14px;padding:min(12px,1.6vh) 20px;font-size:min(22px,3vh);background:#e9e6df}
.cbact .go{background:var(--g);color:#fff;font-weight:700}
.cbh{font-size:22px;font-weight:700;margin:10px 0 6px}
.cbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px}
.ach{background:#fff;border:2px solid #e2d6a4;border-radius:10px;padding:6px 8px;font-size:21px;white-space:nowrap;display:flex;align-items:center;gap:8px;justify-content:center}
.tf{display:grid;grid-template-columns:repeat(5,9px);gap:2px}
.tf i{width:9px;height:9px;border-radius:50%;background:var(--r)}.tf i.a{background:var(--b)}

/* ---------- Fiche complète ---------- */
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.card{border:2px solid #ddd;border-radius:16px;padding:12px;overflow:hidden;background:#fff}
.card .in{zoom:.5}
.card .in .hl{outline:none!important;background:none!important;transform:none}
#print{display:none}
#start .printb{font-size:min(20px,3vh);border:none;background:#fff;border-radius:12px;padding:8px 16px}
#start .pnote{font-size:min(15px,2.2vh);color:#666;text-align:center;max-width:420px}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .page{width:190mm;height:277mm;break-after:page;page-break-after:always;overflow:hidden}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page svg{width:190mm;height:277mm;display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="start">
  <div class="sL">
    <h1>🌟 Le nombre du jour</h1>
    <div class="q">Maîtresse, quel est le nombre du jour ?</div>
    <div id="aff"></div>
    <div id="msg"></div>
    <button class="alea" id="alea">🎲 Un nombre au hasard</button>
    <button class="p2go" id="p2go">🎯 Passer directement au « Compte est bon »</button>
    <button class="printb" id="printb">🖨️ Imprimer les 2 fiches élèves (A4)</button>
    <div class="pnote">Pour obtenir un PDF : dans la fenêtre d'impression, choisir « Enregistrer au format PDF ».</div>
  </div>
  <div class="pad" id="pad"></div>
</div>

<header>
  <button class="part" id="p1b">1 · Le nombre du jour</button>
  <button class="nj" id="nj" title="Changer le nombre">Nombre du jour :<b id="njv"></b></button>
  <nav id="nav"></nav>
  <button class="part" id="p2b">2 · 🎯 Le compte est bon</button>
</header>
<main id="main">
  <section class="panel" id="ex"></section>
  <section class="panel" id="aide"></section>
</main>
<footer>
  <button id="bPrev">◀</button>
  <button id="bAide" class="on">💡 Aide</button>
  <button id="bCorr">✨ Correction</button>
  <button id="bReset">↺ Effacer</button>
  <select id="vit" title="Vitesse de l'animation"><option value="1.7">🐢 Lent</option><option value="1" selected>Normal</option><option value="0.5">🐇 Rapide</option></select>
  <button id="bNext">▶</button>
</footer>

<div id="print"></div>
<script>
/* ================= outils ================= */
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const SVGNS='http://www.w3.org/2000/svg';
const sv=(tag,attrs,txt)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;};

function makeCtx(fast){
  const id=fast?null:++RUN;
  const k={fast,
    async wait(ms){if(fast)return;await new Promise(r=>setTimeout(r,ms*SPEED));if(id!==RUN)throw STOP;},
    async fly(from,to,html,cls,dur=750){
      if(fast||!from||!to)return;
      const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
      const f=h('div','flyer '+(cls||''),html);
      f.style.cssText=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`;
      document.body.appendChild(f);f.getBoundingClientRect();
      f.style.transition=`transform ${dur*SPEED}ms ease-in-out`;
      f.style.transform=`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(1.1)`;
      try{await k.wait(dur);}finally{f.remove();}
    },
    async type(el,txt,ms=100){if(fast){el.textContent+=txt;return;}for(const ch of txt){el.textContent+=ch;await k.wait(ms);}}
  };
  return k;
}

/* ================= nombres en lettres ================= */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
const T={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante'};
function w100(n,rect){
  const ET=rect?['-','et','-']:[' ','et',' '];
  if(n<17)return[U[n]];
  if(n<20)return['dix','-',U[n-10]];
  const t=Math.floor(n/10),u=n%10;
  if(t===7)return['soixante',...(u===1?ET:['-']),...w100(10+u,rect)];
  if(t===9)return['quatre','-','vingt','-',...w100(10+u,rect)];
  if(t===8)return u===0?['quatre','-','vingts']:['quatre','-','vingt','-',...w100(u,rect)];
  if(u===0)return[T[t]];
  if(u===1)return[T[t],...ET,'un'];
  return[T[t],'-',...w100(u,rect)];
}
function toWords(n,rect){
  const sep=rect?'-':' ';
  if(n===0)return['zéro'];
  const a=[];let r=n;
  if(r>=1000){a.push('mille');r-=1000;if(r>0)a.push(sep);}
  const c=Math.floor(r/100),d=r%100;
  if(c>0){if(c>1)a.push(U[c],sep);a.push(c>1&&d===0?'cents':'cent');if(d>0)a.push(sep);}
  if(d>0)a.push(...w100(d,rect));
  return a;
}
const baseOf=t=>t==='cents'?'cent':t==='vingts'?'vingt':t;

function cbSim(nums,sign){
  const P=[],M=[];sign.forEach((x,i)=>{if(x>0)P.push({v:nums[i],id:'c'+i});if(x<0)M.push({v:nums[i],id:'c'+i});});
  let pool=P.slice(),ops=[],rc=0,aids=0;
  while(pool.length>1){
    let bi=0,bj=1,bs=-1,ba=null;
    for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
      const a=pool[i].v,b=pool[j].v;let pr=0,aid=null;
      if(a%10&&b%10&&a%10+b%10===10){pr=3;aid='c10';}else if(a===b){pr=2;aid='dbl';}else if(a%10===0&&b%10===0)pr=1;
      const sc=pr*100000+a+b;if(sc>bs){bs=sc;bi=i;bj=j;ba=aid;}
    }
    const A=pool[bi],B=pool[bj],r={v:A.v+B.v,id:'r'+(rc++)};
    ops.push({a:A,b:B,op:'+',r,aid:ba});if(ba)aids++;
    pool=pool.filter((_,q)=>q!==bi&&q!==bj);pool.push(r);
  }
  let c=pool[0];
  for(const m of M.sort((x,y)=>y.v-x.v)){const r={v:c.v-m.v,id:'r'+(rc++)};ops.push({a:c,b:m,op:'−',r});c=r;}
  return{ops,final:c,value:c.v,score:aids*3-M.length*6-(P.length+M.length)};
}
function cbSolve(nums,T){
  const n=nums.length,ex=[];let best=null;const sg=new Array(n).fill(0);
  const rec=(i,val,np,neg)=>{
    if(i===n){if(!np||val<0)return;const d=Math.abs(val-T);
      if(d===0){if(ex.length<3000)ex.push(sg.slice());}else if(!best||d<best.d)best={d,s:sg.slice()};return;}
    sg[i]=0;rec(i+1,val,np,neg);sg[i]=1;rec(i+1,val+nums[i],np+1,neg);
    if(neg){sg[i]=-1;rec(i+1,val-nums[i],np,neg);}sg[i]=0;
  };
  rec(0,0,0,false);
  if(ex.length<3)rec(0,0,0,true);
  if(!ex.length)return[cbSim(nums,best.s)];
  const seen=new Set(),out=[];
  for(const s of ex){const key=nums.map((v,i)=>s[i]?s[i]*v:null).filter(x=>x!==null).sort((a,b)=>a-b).join(',');
    if(seen.has(key))continue;seen.add(key);out.push(cbSim(nums,s));}
  out.sort((a,b)=>b.score-a.score);return out.slice(0,30);
}

    else if(s.length<3)s=(s+t).replace(/^0(\d)/,'$1');
    aff.textContent=s;};
  ['7','8','9','4','5','6','1','2','3','⌫','0','OK'].forEach(t=>{const b=h('button',t==='OK'?'ok':t==='⌫'?'del':null,t==='OK'?(isT?'OK':'Ajouter'):t);b.onclick=()=>press(t);$('.pad',ex).appendChild(b);});
  if(isT){
    const b1=h('button',null,'◀ Revenir aux nombres');b1.onclick=()=>{CB.phase='nums';go(cur);};
    const b2=h('button',null,`🌟 Le nombre du jour (${N})`);b2.onclick=()=>{s=String(N);press('OK');};
    if(N==null)b2.style.display='none';
    act.append(b1,b2);
  }else{
    const b1=h('button',null,'🗑 Tout effacer');b1.onclick=()=>{CB.nums=[];prev();};
    const b2=h('button','go','Suivant : le nombre à trouver ▶');b2.onclick=()=>{if(!CB.nums.length)return;CB.phase='target';go(cur);};
    act.append(b1,b2);
  }
  prev();
  return{ready:false,input:press};
}

    line.scrollIntoView({block:'nearest',behavior:k.fast?'auto':'smooth'});
    aidEl&&aidEl.classList.remove('hl');
    await k.wait(900);
  }
  const fc=card(sol.final.id);fc&&fc.classList.remove('used');fc&&fc.classList.add('win');

const P2=STEPS.length+1;
const stepOf=i=>i===P2?CBSTEP:STEPS[i];
function go(i){
  stopAnim();cur=Math.max(0,Math.min(P2,i));
  const p2=cur===P2;
  document.body.classList.toggle('p2',p2);
  [...nav.children].forEach((b,j)=>b.classList.toggle('on',j===cur));
  R=null;ex.classList.remove('inp');ex.innerHTML='';aide.innerHTML='';ex.style.removeProperty('--cell');ex.scrollTop=0;
  const recap=cur===STEPS.length;
  $('#bCorr').disabled=$('#bReset').disabled=$('#bAide').disabled=recap;
  $('#bPrev').disabled=cur===0;$('#bNext').disabled=p2;
  $('#bNext').textContent=recap?'Partie 2 : Le compte est bon ▶':'▶';
  main.classList.toggle('noaide',recap||!$('#bAide').classList.contains('on'));
  if(recap){renderRecap();fitAll();return;}
  R=stepOf(cur).render(ex,aide);
  $('#bCorr').disabled=R&&R.ready===false;
  if(R&&R.ready===false){main.classList.add('noaide');}
  fitAll();
}
async function correction(){
  if(cur===STEPS.length)return;
  go(cur);const k=makeCtx(false);
  try{await stepOf(cur).solve(k,R);}catch(e){if(e!==STOP)console.error(e);}
}
function renderRecap(){
  ex.innerHTML=`<h2 class="t">Le nombre du jour : ${N}</h2>`;
  const g=h('div','recap');ex.appendChild(g);
  STEPS.forEach(s=>{
    const card=h('div','card'),inn=h('div','in');card.appendChild(inn);g.appendChild(card);
    const ghost=h('div');ghost.style.cssText='position:absolute;left:-9999px;top:0;width:600px';document.body.appendChild(ghost);
    try{const r=s.render(inn,ghost);s.solve(makeCtx(true),r).finally(()=>ghost.remove());}catch(e){console.error(e);ghost.remove();}
  });
}


/* ================= tout tenir sur un écran ================= */
function wrapFit(panel){
  let w=panel.firstElementChild;
  if(!(w&&w.classList.contains('fitw')&&panel.children.length===1)){
    w=h('div','fitw');while(panel.firstChild)w.appendChild(panel.firstChild);panel.appendChild(w);
  }
  return w;
}
function fitPanel(panel){
  if(!panel.offsetParent)return;
  const w=wrapFit(panel),cs=getComputedStyle(panel);
  const aw=panel.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=panel.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const ok=z=>{w.style.zoom=z;w.style.width=(aw/z)+'px';return w.scrollHeight*z<=ah+1;};
  if(ok(1)&&w.scrollWidth<=aw+1)return;
  let lo=0.25,hi=1;
  for(let i=0;i<9;i++){const m=(lo+hi)/2;if(ok(m))lo=m;else hi=m;}
  ok(lo);
  const sw=w.scrollWidth,cw=aw/lo;if(sw>cw+1){const z=lo*cw/sw;w.style.zoom=z;w.style.width=(aw/z)+'px';}
}
let fitQ=false;
function fitAll(){if(fitQ)return;fitQ=true;requestAnimationFrame(()=>{fitQ=false;fitObs.disconnect();
  [ex,aide].forEach(p=>{if(!p.classList.contains('inp'))fitPanel(p);});
  fitObs.observe(ex,{childList:true,subtree:true,characterData:true});fitObs.observe(aide,{childList:true,subtree:true,characterData:true});});}
const fitObs=new MutationObserver(fitAll);
addEventListener('resize',fitAll);

$('#bPrev').onclick=()=>go(cur===P2?STEPS.length:cur-1);
$('#p1b').onclick=()=>{if(N==null){stopAnim();saisie='';aff.textContent='';$('#start').style.display='flex';}else go(0);};
$('#p2b').onclick=()=>go(P2);
$('#bNext').onclick=()=>go(cur+1);
$('#bCorr').onclick=correction;
$('#bReset').onclick=()=>go(cur);
$('#bAide').onclick=e=>{e.currentTarget.classList.toggle('on');main.classList.toggle('noaide',!e.currentTarget.classList.contains('on'));fitAll();};
$('#vit').onchange=e=>SPEED=+e.target.value;
document.addEventListener('keydown',e=>{
  if($('#start').style.display!=='none'){
    if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('OK');return;}
  if(R&&R.input&&/^(\d|Backspace|Enter)$/.test(e.key)){e.preventDefault();R.input(e.key==='Backspace'?'⌫':e.key==='Enter'?'OK':e.key);return;}
  if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();correction();}
});

/* ================= écran de départ ================= */
let saisie='';const aff=$('#aff'),msg=$('#msg');
['7','8','9','4','5','6','1','2','3','⌫','0','OK'].forEach(t=>{const b=h('button',t==='OK'?'ok':t==='⌫'?'del':null,t);b.onclick=()=>press(t);$('#pad').appendChild(b);});
function press(t){
  msg.textContent='';
  if(t==='⌫')saisie=saisie.slice(0,-1);
  else if(t==='OK'){if(saisie==='')return;const n=parseInt(saisie,10);if(n>999){msg.textContent='Choisis un nombre entre 0 et 999.';return;}start(n);return;}
  else if(saisie.length<3)saisie=(saisie+t).replace(/^0(\d)/,'$1');
  aff.textContent=saisie;
}
function start(n){N=n;$('#njv').textContent=N;$('#start').style.display='none';go(0);}
$('#printb').onclick=printFiches;
$('#p2go').onclick=()=>{$('#start').style.display='none';go(P2);};
$('#alea').onclick=()=>{saisie=String(10+Math.floor(Math.random()*990));aff.textContent=saisie;};
$('#nj').onclick=()=>{stopAnim();saisie='';aff.textContent='';$('#start').style.display='flex';};
</script>
